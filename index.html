
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game 0.01</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<script type="module">
import * as THREE from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x808080);

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(12, 16),
    new THREE.MeshBasicMaterial({color: 0x555555})
);

floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const grid = new THREE.GridHelper(12, 12);
grid.position.y = 0.01;
scene.add(grid);

function createCharacter(color) {

    const character = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, 1.2, 0.4),
        new THREE.MeshBasicMaterial({color: color})
    );

    body.position.y = 0.6;
    character.add(body);

    const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.4, 0.4),
        new THREE.MeshBasicMaterial({color: color})
    );

    head.position.y = 1.4;
    character.add(head);

    return character;
}

const player = createCharacter(0x3366cc);
player.position.set(0, 0, 5);

scene.add(player);

const opponent = createCharacter(0xcc3333);
opponent.position.set(0, 0, -5);

scene.add(opponent);

function moveCharacter(character, direction, delta) {
    const speed = 4;

    character.position.x += direction * speed * delta;

    character.position.x = THREE.MathUtils.clamp(
        character.position.x, -5, 5
    );
}

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(0, 7, 17);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);

let previousTime = performance.now();

renderer.setAnimationLoop((time) => {

    const delta = Math.min(
        (time - previousTime) / 1000, 0.05
    );

    previousTime = time;

    moveCharacter(player, 1, delta);

    renderer.render(scene, camera);
});

</script>

</body>
</html>
